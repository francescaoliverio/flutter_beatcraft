on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v4
      - name: Installa Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Installa dipendenze
        run: flutter pub get
      - name: Compila BeatCraft in Release
        env:
          JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
        run: flutter build ios --release --no-codesign --dart-define=JAMENDO_CLIENT_ID=$JAMENDO_CLIENT_ID
      - name: Crea IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r BeatCraft-Release.ipa Payload
      - name: Carica IPA
        uses: actions/upload-artifact@v4
        with:
          name: BeatCraft-Release
          path: BeatCraft-Release.ipa